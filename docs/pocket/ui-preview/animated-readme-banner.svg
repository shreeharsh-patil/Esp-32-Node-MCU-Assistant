<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 435" width="1080" height="435" role="img" aria-labelledby="title desc">
<title id="title">Shreeharsh Assistant — animated project artwork</title>
<desc id="desc">A black and midnight-purple banner with Shreeharsh Assistant lettering and an illustrated horizontal ESP32 assistant face, blinking eyes, glowing pink cheeks and an animated sound-wave mouth. Concept artwork, not a physical-device photograph.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08080d"/><stop offset=".55" stop-color="#121021"/><stop offset="1" stop-color="#070913"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#e79bb9" stop-opacity=".22"/><stop offset="1" stop-color="#e79bb9" stop-opacity="0"/></radialGradient>
<linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42404f"/><stop offset=".45" stop-color="#242635"/><stop offset="1" stop-color="#11121e"/></linearGradient>
<linearGradient id="eye" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#fffefb"/><stop offset="1" stop-color="#eddcea"/></linearGradient>
<radialGradient id="cheek"><stop stop-color="#ffa9ca" stop-opacity=".75"/><stop offset=".6" stop-color="#e98ab2" stop-opacity=".25"/><stop offset="1" stop-color="#e98ab2" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
</defs>
